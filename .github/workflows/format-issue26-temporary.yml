name: Issue 26 temporary format
on:
  push:
    branches:
      - feat/issue-26-discovery-read-adapter
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'raulacden/sports-events-web'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-26-discovery-read-adapter
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Format changed files
        run: npx prettier --write src/app/admin/discovery/page.tsx src/app/admin/discovery/results/\[resultId\]/page.tsx src/app/admin/discovery/executions/\[executionId\]/page.tsx src/integrations/discovery/readApi.ts src/data/discoveryRepositoryProvider.ts
      - name: Commit formatting if needed
        run: |
          git diff --check
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/app/admin/discovery/page.tsx src/integrations/discovery/readApi.test.ts src/integrations/discovery/readApi.ts src/presentation/admin/LiveDiscovery.tsx
            git commit -m "style(discovery): format new read adapter and views"
            git push origin HEAD:feat/issue-26-discovery-read-adapter
          fi
