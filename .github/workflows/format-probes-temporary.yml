name: TEMP offline formatting evidence
on:
  push:
    branches:
      - test/94-staging-supabase-service-probes
permissions:
  contents: read
jobs:
  format-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Format only new source and print nonsecret source evidence
        shell: bash
        run: |
          ./node_modules/.bin/prettier --write docs/staging-platform-functional-probes.md scripts/staging-platform-probes.mjs scripts/staging-platform-probes.test.mjs
          for f in docs/staging-platform-functional-probes.md scripts/staging-platform-probes.mjs scripts/staging-platform-probes.test.mjs; do
            echo "FORMATTED_START:$f"
            base64 -w0 "$f"
            echo
            echo "FORMATTED_END:$f"
          done
