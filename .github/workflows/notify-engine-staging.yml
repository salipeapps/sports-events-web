name: Notify Engine STAGING pipeline

# Web authors its SQL in supabase/migrations but never applies it: the Engine STAGING
# pipeline is the single database deployer. This only asks it to evaluate this commit.
# Vercel keeps deploying the Web app; the Engine reports a `staging-db` status here.

on:
  push:
    branches:
      - develop

permissions: {}

concurrency:
  group: notify-engine-staging
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Dispatch the Engine STAGING evaluation on develop
        env:
          GH_TOKEN: ${{ secrets.ENGINE_DISPATCH_TOKEN }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::warning::ENGINE_DISPATCH_TOKEN is not configured; the Engine will evaluate this commit on its next run."
            exit 0
          fi
          gh api -X POST repos/raulacden/sports-events-engine/actions/workflows/staging-deploy.yml/dispatches \
            -f ref=develop -f "inputs[mode]=deploy" -f "inputs[web_sha]=$GITHUB_SHA"
          echo "Engine STAGING evaluation requested for sports-events-web $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"
