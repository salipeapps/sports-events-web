name: Temporary Staging Docs Formatter
on:
  push:
    branches:
      - chore/staging-discovery-activation-gates
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/staging-discovery-activation-gates
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prettier --write docs/staging-discovery-activation.md
      - name: Commit formatted documentation
        run: |
          git diff --check
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/staging-discovery-activation.md
            git commit -m "style(staging): normalize activation runbook with Prettier"
            git push origin HEAD:chore/staging-discovery-activation-gates
          fi
