name: Quality

on:
  pull_request:
    branches:
      - develop
      - master
      - main
  push:
    branches:
      - develop
      - master
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run quality checks
        run: |
          npx prettier --write src/app/admin/candidates/[candidateId]/actions.ts src/presentation/admin/CandidateReview.tsx
          git diff -- src/app/admin/candidates/[candidateId]/actions.ts src/presentation/admin/CandidateReview.tsx
          exit 1
