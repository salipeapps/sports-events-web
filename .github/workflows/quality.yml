name: Quality

on:
  pull_request:
    branches:
      - develop
      - master
      - main
  push:
    branches:
      - develop
      - master
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run quality checks
        run: |
          npx prettier --write .
          node <<'NODE'
          const fs = require('node:fs');
          const files = ["src/domain/admin.ts","src/domain/adminValidation.ts","src/domain/adminValidation.test.ts","src/data/fixtures/organizerSourceFixtures.ts","src/presentation/admin/AdminNavigation.tsx","src/presentation/admin/sourceRunPresentation.ts","src/presentation/admin/sourceRunPresentation.test.ts","src/presentation/admin/AdminSourceRunViews.tsx","src/presentation/admin/AdminSourceRunViews.test.tsx","src/presentation/admin/CandidateReview.tsx","src/app/globals.css","src/app/admin/sources/page.tsx","src/app/admin/sources/loading.tsx","src/app/admin/sources/[sourceId]/page.tsx","src/app/admin/runs/page.tsx","src/app/admin/runs/loading.tsx","src/app/admin/runs/[runId]/page.tsx"];
          for (const file of files) {
            const json = JSON.stringify(fs.readFileSync(file, 'utf8'));
            console.log('PRETTIER_BEGIN|' + file + '|' + json.length);
            for (let i = 0; i < json.length; i += 2800) {
              console.log('PRETTIER_PART|' + file + '|' + i + '|' + json.slice(i, i + 2800));
            }
            console.log('PRETTIER_END|' + file);
          }
          NODE
          npm run quality
