name: Quality

on:
  pull_request:
    branches:
      - develop
      - master
      - main
  push:
    branches:
      - develop
      - master
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run quality checks
        run: npm run quality

      - name: Show remaining issue 5 Prettier diff
        if: failure()
        run: |
          npx prettier --write src/presentation/admin/candidateReviewForm.test.ts
          git diff -- src/presentation/admin/candidateReviewForm.test.ts
