name: Quality

on:
  pull_request:
    branches:
      - develop
      - master
      - main
  push:
    branches:
      - develop
      - master
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run quality checks
        run: |
          npx prettier --write .
          node <<'NODE'
          const fs = require('node:fs');
          const files = ["src/presentation/admin/sourceRunPresentation.ts","src/data/adminRepository.ts","src/data/fixtures/fixtureAdminRepository.ts","src/app/admin/sources/page.tsx","src/app/admin/runs/page.tsx","src/app/admin/runs/[runId]/page.tsx","src/presentation/admin/AdminSourceRunViews.tsx","src/presentation/admin/sourceRunPresentation.test.ts","src/data/fixtures/fixtureAdminRepository.test.ts","src/presentation/admin/AdminSourceRunViews.test.tsx"];
          for (const file of files) {
           const json = JSON.stringify(fs.readFileSync(file,'utf8'));
           console.log('REVIEW_PRETTIER_BEGIN|' + file + '|' + json.length);
           for (let i=0;i<json.length;i+=2800) console.log('REVIEW_PRETTIER_PART|' + file + '|' + i + '|' + json.slice(i,i+2800));
           console.log('REVIEW_PRETTIER_END|' + file);
          }
          NODE
          npm run quality
