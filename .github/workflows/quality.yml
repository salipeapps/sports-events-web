name: Quality

on:
  pull_request:
    branches:
      - develop
      - master
      - main
  push:
    branches:
      - develop
      - master
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run quality checks
        run: npm run quality

      - name: Show Prettier diff on failure
        if: failure()
        run: |
          npx prettier --write src/app/admin/activities/page.tsx src/app/admin/candidates/[candidateId]/page.tsx src/app/admin/candidates/page.tsx src/app/globals.css src/presentation/admin/adminActivityLoader.ts src/presentation/admin/adminActivityQuery.ts src/presentation/admin/AdminActivityTable.tsx src/presentation/admin/AdminDashboard.tsx src/presentation/admin/adminPresentation.ts
          git diff -- src/app/admin/activities/page.tsx src/app/admin/candidates/[candidateId]/page.tsx src/app/admin/candidates/page.tsx src/app/globals.css src/presentation/admin/adminActivityLoader.ts src/presentation/admin/adminActivityQuery.ts src/presentation/admin/AdminActivityTable.tsx src/presentation/admin/AdminDashboard.tsx src/presentation/admin/adminPresentation.ts
