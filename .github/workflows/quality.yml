name: Issue 7 preflight (temporary)
on:
  pull_request:
    branches:
      - develop
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Synchronize lockfile before validation
        run: npm install --package-lock-only --ignore-scripts
      - name: Install dependencies
        run: npm ci
      - name: Format all files
        run: npm run format
      - name: Output formatted source for final commit
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const files=["README.md",".gitignore","package.json","package-lock.json","src/presentation/admin/AdminNavigation.tsx","src/data/fixtures/organizerSourceFixtures.ts","src/domain/discovery.ts","src/data/fixtures/fixtureDiscoveryRepository.ts","src/data/discoveryRepositoryProvider.ts","src/presentation/admin/DiscoveryOverview.tsx","src/app/admin/discovery/page.tsx","src/app/admin/discovery/results/[resultId]/page.tsx","src/app/admin/discovery/executions/[executionId]/page.tsx","src/app/admin/discovery/loading.tsx","src/presentation/admin/AdminSourceRunViews.tsx","src/app/globals.css","playwright.config.ts","e2e/admin-auth.spec.ts","e2e/admin-flow.spec.ts","src/presentation/admin/DiscoveryOverview.test.tsx","docs/admin-v0-e2e.md","docs/admin-mock-migration.md"];
          for(const path of files){
           const packed=JSON.stringify(fs.readFileSync(path,'utf8'));
           console.log('ISSUE7_PREP_BEGIN|'+path+'|'+packed.length);
           for(let i=0;i<packed.length;i+=2600) console.log('ISSUE7_PREP_PART|'+path+'|'+i+'|'+packed.slice(i,i+2600));
           console.log('ISSUE7_PREP_END|'+path);
          }
          NODE
      - name: Format lint types unit tests and build
        run: npm run quality
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: E2E authorized
        run: npm run test:e2e
      - name: E2E fail closed
        run: ADMIN_DEV_AUTH_MODE=disabled npm run test:e2e -- e2e/admin-auth.spec.ts
