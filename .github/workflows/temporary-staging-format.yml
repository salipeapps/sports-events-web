name: Temporary Prettier Staging Fix
on:
  push:
    branches:
      - chore/staging-discovery-activation-gates
permissions:
  contents: write
jobs:
  format:
    if: "!contains(github.event.head_commit.message, 'style(staging): autoformat smoke')"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/staging-discovery-activation-gates
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write docs/staging-discovery-activation.md src/app/api/internal/discovery-read-smoke/route.ts
      - name: Commit formatting if needed
        run: |
          if ! git diff --quiet -- docs/staging-discovery-activation.md src/app/api/internal/discovery-read-smoke/route.ts; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add docs/staging-discovery-activation.md src/app/api/internal/discovery-read-smoke/route.ts
            git commit -m 'style(staging): autoformat smoke with project Prettier'
            git push origin HEAD:refs/heads/chore/staging-discovery-activation-gates
          fi
